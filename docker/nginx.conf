# The chosen skin, from the nmtheme cookie; anything odd counts as none.
map $cookie_nmtheme $nmtheme {
    default              "";
    "~^[a-z0-9-]{1,32}$" $cookie_nmtheme;
}
# Back to the page the visitor came from, on this site only.
map $http_referer $nmback {
    default                    "/";
    "~^https?://[^/]+(?<nmpath>/[^\s]*)$" $nmpath;
}

# The site at /, MediaWiki under /w/ (its scripts and files) and /wiki/
# (its pages). PHP goes to the mediawiki container (PHP-FPM).
server {
    listen 80;
    server_name _;
    root /public/site;
    charset utf-8;
    absolute_redirect off;
    client_max_body_size 32m;

    # /_theme/<name>: remember the skin for a year, back to the same page
    location ~ "^/_theme/(?<nmskin>[a-z0-9-]{1,32})$" {
        add_header Set-Cookie "nmtheme=$nmskin; Path=/; Max-Age=31536000; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 $nmback;
    }

    # the stylesheets follow the cookie, on the site and in the wiki.
    # "private" keeps Cloudflare from caching one visitor's skin for
    # everybody; no-cache lets the browser keep it but ask again.
    location = /static/css/nanny.css {
        add_header Cache-Control "private, no-cache" always;
        add_header Vary "Cookie" always;
        try_files /static/css/themes/$nmtheme.css /static/css/nanny.css =404;
    }
    location = /static/css/nanny-wiki.css {
        add_header Cache-Control "private, no-cache" always;
        add_header Vary "Cookie" always;
        try_files /static/css/themes/$nmtheme-wiki.css /static/css/nanny-wiki.css =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # pages: /wiki/Name runs index.php with the title
    location /wiki/ {
        rewrite ^/wiki/(.*)$ /w/index.php?title=$1 last;
    }
    location = /wiki { return 301 /wiki/; }

    location /w/images/ {
        alias /mediawiki-images/;
        location ~ \.php$ { deny all; }
    }
    location ^~ /w/images/deleted/ { deny all; }

    # the site's header and footer around every wiki page: build.py writes
    # them to /_wiki/, and SSI pulls them in where sub_filter marks the
    # page's first and last tags. Only internal subrequests may read them.
    location ^~ /_wiki/ { internal; }
    location = /w/index.php {
        include fastcgi_params;
        fastcgi_pass mediawiki:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_param MW_CONFIG_FILE /var/www/html/settings/LocalSettings.php;
        # MediaWiki gzips its own output, and sub_filter needs it plain
        fastcgi_param HTTP_ACCEPT_ENCODING "";
        gzip on;
        ssi on;
        sub_filter_once on;
        sub_filter '<a class="mw-jump-link"' '<!--# include virtual="/_wiki/header.html" --><a class="mw-jump-link"';
        sub_filter '</body>' '<!--# include virtual="/_wiki/footer.html" --></body>';
    }

    location /w/ {
        alias /mediawiki/;
        try_files $uri $uri/ =404;
        # never serve the wiki's own private parts
        location ~ ^/w/(cache|maintenance|vendor|tests|serialized|includes|languages|settings|mw-config)/ { deny all; }
        location ~ ^/w/(.+\.php)(/.*)?$ {
            include fastcgi_params;
            fastcgi_pass mediawiki:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/$1;
            fastcgi_param PATH_INFO $2;
            fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
            # PHP-FPM drops the container's environment; MediaWiki finds
            # LocalSettings.php through this
            fastcgi_param MW_CONFIG_FILE /var/www/html/settings/LocalSettings.php;
        }
    }
    # links to the wiki from before it moved under /wiki/. The old wiki
    # answered / with a permanent redirect to /index.php/Main_Page, which
    # browsers remember; send that one to the home page, under another
    # URL than / so the remembered redirect cannot loop.
    location = /index.php/Main_Page { return 302 /?home; }
    location ~ ^/index\.php/(.*)$ { return 301 /wiki/$1; }
    location = /index.php { return 301 /w/index.php$is_args$args; }
}
