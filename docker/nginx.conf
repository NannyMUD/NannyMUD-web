# The site at /, MediaWiki under /w/ (its scripts and files) and /wiki/
# (its pages). PHP goes to the mediawiki container (PHP-FPM).
server {
    listen 80;
    server_name _;
    root /public/site;
    charset utf-8;
    absolute_redirect off;
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ =404;
    }

    # pages: /wiki/Name runs index.php with the title
    location /wiki/ {
        rewrite ^/wiki/(.*)$ /w/index.php?title=$1 last;
    }
    location = /wiki { return 301 /wiki/; }

    location /w/images/ {
        alias /mediawiki-images/;
        location ~ \.php$ { deny all; }
    }
    location ^~ /w/images/deleted/ { deny all; }

    location /w/ {
        alias /mediawiki/;
        try_files $uri $uri/ =404;
        # never serve the wiki's own private parts
        location ~ ^/w/(cache|maintenance|vendor|tests|serialized|includes|languages|settings|mw-config)/ { deny all; }
        location ~ ^/w/(.+\.php)(/.*)?$ {
            include fastcgi_params;
            fastcgi_pass mediawiki:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/$1;
            fastcgi_param PATH_INFO $2;
            fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
            # PHP-FPM drops the container's environment; MediaWiki finds
            # LocalSettings.php through this
            fastcgi_param MW_CONFIG_FILE /var/www/html/settings/LocalSettings.php;
        }
    }
    # links to the wiki from before it moved under /wiki/
    location ~ ^/index\.php/(.*)$ { return 301 /wiki/$1; }
    location = /index.php { return 301 /w/index.php$is_args$args; }
}
