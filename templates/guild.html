{% extends "base.html" %}
{% block main %}
<article class="nm-card nm-guild">
<p class="nm-small"><a href="/guilds/">Guilds</a> / {{ page.title }}</p>
<h1>{{ page.title }}</h1>
{% if page.images %}<div class="nm-guild-pics">{% for img in page.images %}<img src="{{ img.src }}"{% if img.art %} class="nm-art"{% endif %} alt="{{ page.title }}" loading="lazy">{% endfor %}</div>{% endif %}
{{ page.body | safe }}
</article>
{% endblock %}
