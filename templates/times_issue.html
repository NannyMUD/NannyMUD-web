{% extends "base.html" %}
{% block main %}
<article class="nm-card nm-paper">
<p class="nm-small"><a href="/times/">The NannyMUD Times</a> / {{ issue.label }}</p>
<h1>{{ issue.label }}</h1>
{% for n, text in issue.pages %}
<h3 id="page{{ n }}">Page {{ n }}</h3>
<pre>{{ text }}</pre>
{% endfor %}
</article>
{% endblock %}
